<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherMind — AI Startup Mentor</title>
    <meta name="description" content="AetherMind is your AI-powered startup mentor for Indian entrepreneurs.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Styrene+A:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-brand">
                    <span class="brand-name">AetherMind</span>
                    <button class="icon-btn sidebar-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
                    </button>
                </div>
                <nav class="sidebar-nav">
                    <button class="nav-item" id="newChatBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                        <span>New chat</span>
                    </button>
                    <button class="nav-item" id="searchToggle">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                        <span>Search</span>
                    </button>
                    <button class="nav-item" id="chatsToggle">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <span>Chats</span>
                    </button>
                    <button class="nav-item" id="settingsBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                        <span>Settings</span>
                    </button>
                </nav>
            </div>

            <!-- Search Bar (hidden by default) -->
            <div class="sidebar-search" id="sidebarSearch" style="display:none;">
                <input type="text" id="searchInput" placeholder="Search conversations...">
            </div>

            <!-- Conversations -->
            <div class="sidebar-conversations" id="sidebarConversations">
                <div class="conv-section-label">Starred</div>
                <div id="starredList"></div>
                <div class="conv-section-label">Recents</div>
                <div id="recentsList"></div>
            </div>

            <!-- User Profile -->
            <div class="sidebar-user">
                <div class="user-avatar">D</div>
                <div class="user-info">
                    <span class="user-name">Dhanush</span>
                    <span class="user-plan">Free plan</span>
                </div>
                <div class="connection-dot-wrap">
                    <div class="conn-dot" id="connDot" title="Not connected"></div>
                </div>
            </div>
        </aside>

        <!-- ===== MAIN ===== -->
        <main class="main" id="main">
            <!-- Mobile header -->
            <header class="mobile-header" id="mobileHeader">
                <button class="icon-btn" id="menuToggle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <span class="mobile-title">AetherMind</span>
                <div class="mobile-actions">
                    <button class="icon-btn" id="exportPdfBtn2" title="Export PDF">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    </button>
                </div>
            </header>

            <!-- Messages / Welcome -->
            <div class="messages-scroll" id="messagesScroll">
                <!-- Welcome -->
                <div class="welcome" id="welcomeScreen">
                    <div class="welcome-star">✺</div>
                    <h1 class="welcome-heading" id="welcomeHeading">Good evening, Dhanush</h1>
                </div>

                <!-- Messages injected here -->
                <div id="messagesArea"></div>
            </div>

            <!-- Input -->
            <div class="input-section">
                <div class="input-box" id="inputBox">
                    <textarea id="msgInput" placeholder="How can I help you today?" rows="1"></textarea>
                    <div class="input-bottom-row">
                        <div class="input-left">
                            <button class="icon-btn attach-btn" title="Attach file">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                            </button>
                        </div>
                        <div class="input-right">
                            <div class="model-badge">AetherMind v1</div>
                            <button class="send-btn" id="sendBtn" disabled title="Send">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="suggestion-row" id="suggestionRow">
                    <button class="suggestion" data-prompt="How do I validate my startup idea?">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                        Validate idea
                    </button>
                    <button class="suggestion" data-prompt="What should be included in a pre-seed investor pitch deck for an Indian startup?">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        Pitch deck
                    </button>
                    <button class="suggestion" data-prompt="Explain the difference between a Pvt Ltd company and an LLP for an Indian startup.">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l3 1m0 0l-3 9a5 5 0 006 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5 5 0 006 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
                        Legal structures
                    </button>
                    <button class="suggestion" data-prompt="How do I raise seed funding for my Indian startup?">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                        Fundraising
                    </button>
                    <button class="suggestion" data-prompt="Help me write a cold email to a VC investor.">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        Write emails
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== SETTINGS MODAL ===== -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Connection Settings</h3>
                <button class="icon-btn" id="closeModal">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <label>Gradio Server URL</label>
                <input type="text" id="gradioUrl" placeholder="https://xxxxx.gradio.live">
                <p class="hint">Paste the public URL from your Google Colab notebook.</p>
                <button class="primary-btn" id="connectBtn">Connect</button>
                <div class="modal-status" id="modalStatus"></div>
            </div>
        </div>
    </div>

    <!-- ===== EXPORT MODAL ===== -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Export Conversation</h3>
                <button class="icon-btn" id="closeExportModal">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body export-options">
                <button class="export-option" id="exportPdfBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span>Export as PDF</span>
                </button>
                <button class="export-option" id="exportDocBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.34a2 2 0 0 0-.6-1.43l-4.44-4.34A2 2 0 0 0 13.56 2H6a2 2 0 0 0-2 2z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
                    <span>Export as DOC</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
