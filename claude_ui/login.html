<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sign In - AetherMind</title>
    <meta name="description" content="Sign in to AetherMind — your premium AI-powered computational sandbox for coding, math, and web development."/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #4648d4;
            --primary-light: #6063ee;
            --secondary: #6b38d4;
            --surface: #0a0a14;
            --surface-card: rgba(18, 18, 30, 0.6);
            --text: #f0f0fa;
            --text-muted: #9494b0;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --font: 'Outfit', 'Inter', sans-serif;
            --accent-glow: rgba(70, 72, 212, 0.3);
        }

        body {
            font-family: var(--font);
            background: var(--surface);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }

        .bg-blob-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #4648d4 0%, transparent 70%);
            top: -200px; left: -100px;
            animation-delay: 0s;
        }

        .bg-blob-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #6b38d4 0%, transparent 70%);
            bottom: -150px; right: -100px;
            animation-delay: -7s;
        }

        .bg-blob-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #8455ef 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(40px, 30px) scale(1.02); }
        }

        /* Grid overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        /* Login Card */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: 20px;
            background: var(--surface-card);
            backdrop-filter: blur(60px) saturate(180%);
            -webkit-backdrop-filter: blur(60px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 48px 40px;
            box-shadow:
                0 32px 64px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.97);
        }

        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px var(--accent-glow);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 8px 24px var(--accent-glow); }
            50% { box-shadow: 0 8px 40px rgba(70, 72, 212, 0.5); }
        }

        .logo-icon .material-symbols-outlined {
            font-size: 28px;
            color: white;
        }

        .logo-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #c0c1ff 0%, #d0bcff 50%, #e1e0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 400;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* OAuth Button */
        .btn-oauth {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-family: var(--font);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-oauth:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .btn-oauth:active { transform: scale(0.98); }

        .btn-oauth svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Form inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-family: var(--font);
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input::placeholder {
            color: rgba(148, 148, 176, 0.5);
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn-primary {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(70, 72, 212, 0.4);
        }

        .btn-primary:active { transform: scale(0.98); }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            border-radius: inherit;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Error message */
        .error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 500;
        }

        /* View toggle */
        #emailView { display: none; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--text); }
        .back-link .material-symbols-outlined { font-size: 18px; }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card { padding: 36px 24px; border-radius: 20px; }
            .logo-title { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>
    <div class="grid-overlay"></div>

    <!-- Login Card -->
    <div class="login-card" id="loginCard">
        <!-- Default View: OAuth + Email toggle -->
        <div id="mainView">
            <div class="logo-section">
                <div class="logo-icon">
                    <span class="material-symbols-outlined">neurology</span>
                </div>
                <h1 class="logo-title">AetherMind</h1>
                <p class="logo-subtitle">Sign in to your AI workspace</p>
            </div>

            <!-- Google Login Button Container -->
            <div id="g_id_onload"
                 data-client_id="953249480826-t8h9k4etjqvsdvip39m4q1otc8t6kbde.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="dark"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left"
                 data-width="360">
            </div>

            <div class="divider">or</div>

            <button class="btn-oauth" id="showEmailBtn" type="button">
                <span class="material-symbols-outlined" style="font-size:20px;">mail</span>
                Continue with Email
            </button>

            <p class="error-msg" id="mainError"></p>
        </div>

        <!-- Email Sign-in View -->
        <div id="emailView">
            <span class="back-link" id="backBtn">
                <span class="material-symbols-outlined">arrow_back</span>
                Back
            </span>

            <div class="logo-section" style="margin-bottom: 24px;">
                <h2 class="logo-title" style="font-size: 22px;">Sign in with Email</h2>
                <p class="logo-subtitle">Enter your details to continue</p>
            </div>

            <form id="emailForm" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="nameInput">Full Name</label>
                    <input class="form-input" type="text" id="nameInput" placeholder="John Doe" required/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="emailInput">Email Address</label>
                    <input class="form-input" type="email" id="emailInput" placeholder="you@example.com" required/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="passwordInput">Password</label>
                    <input class="form-input" type="password" id="passwordInput" placeholder="••••••••" minlength="6" required/>
                </div>

                <button class="btn-primary" type="submit" id="emailSubmitBtn">
                    Sign In
                </button>
                <p class="error-msg" id="emailError"></p>
            </form>
        </div>

        <div class="login-footer">
            AetherMind v2.2 &bull; Premium AI Workspace<br/>
            &copy; 2025 AetherMind Project
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Redirect if already logged in
        if (localStorage.getItem('am_user')) {
            window.location.href = 'index.html';
        }

        const mainView = document.getElementById('mainView');
        const emailView = document.getElementById('emailView');

        // Show email form
        document.getElementById('showEmailBtn').addEventListener('click', () => {
            mainView.style.display = 'none';
            emailView.style.display = 'block';
        });

        // Back to main
        document.getElementById('backBtn').addEventListener('click', () => {
            emailView.style.display = 'none';
            mainView.style.display = 'block';
        });

        // Initialize Google Sign-in SDK
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "953249480826-t8h9k4etjqvsdvip39m4q1otc8t6kbde.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
        };

        // Callback handling the real JWT response from Google
        function handleCredentialResponse(response) {
            try {
                const responsePayload = parseJwt(response.credential);
                const user = {
                    name: responsePayload.name,
                    email: responsePayload.email,
                    avatar: responsePayload.picture,
                    provider: 'google',
                    loginAt: new Date().toISOString()
                };
                localStorage.setItem('am_user', JSON.stringify(user));
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Failed to authenticate Google user:", error);
                document.getElementById('mainError').textContent = 'Authentication failed. Please try again.';
            }
        }

        // Helper to parse base64 JWT payload from Google credential
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Email Sign-In
        document.getElementById('emailForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('nameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('emailError');
            const btn = document.getElementById('emailSubmitBtn');

            errorEl.textContent = '';

            if (!name || !email || password.length < 6) {
                errorEl.textContent = 'Please fill all fields. Password must be 6+ characters.';
                return;
            }

            btn.innerHTML = '<span class="spinner"></span> Signing in...';
            btn.disabled = true;

            setTimeout(() => {
                const user = {
                    name: name,
                    email: email,
                    avatar: '',
                    provider: 'email',
                    loginAt: new Date().toISOString()
                };
                localStorage.setItem('am_user', JSON.stringify(user));
                window.location.href = 'index.html';
            }, 1200);
        });
    </script>
</body>
</html>
