<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('aether-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#0b0a11; --bg-2:#100e18; --surface:#15121f; --surface-2:#1c1828;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --text:#ece9f5; --text-dim:#a39fb5; --text-faint:#6f6b80;
  --violet:#7c5cff; --violet-2:#a78bfa; --violet-soft:rgba(124,92,255,.16);
  --aether:#5eead4; --aether-soft:rgba(94,234,212,.14);
  --glow-1:rgba(124,92,255,.55); --glow-2:rgba(124,92,255,.18);
  --grid:rgba(255,255,255,.04); --danger:#ff6b6b; --danger-soft:rgba(255,107,107,.12);
  --shadow:0 24px 60px -20px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#f4f2fb; --bg-2:#ebe8f6; --surface:#ffffff; --surface-2:#f6f4fc;
  --border:rgba(24,18,48,.10); --border-strong:rgba(24,18,48,.18);
  --text:#191427; --text-dim:#5b5570; --text-faint:#8b8699;
  --violet:#6d4bf0; --violet-2:#7c5cff; --violet-soft:rgba(109,75,240,.10);
  --aether:#0fb89a; --aether-soft:rgba(15,184,154,.12);
  --glow-1:rgba(124,92,255,.30); --glow-2:rgba(124,92,255,.10);
  --grid:rgba(24,18,48,.05); --danger:#d63a3a; --danger-soft:rgba(214,58,58,.10);
  --shadow:0 24px 60px -28px rgba(60,40,120,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--violet);color:#fff}
input::placeholder{color:var(--text-faint)}
@keyframes auroraPulse{0%,100%{opacity:.85;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
</style>
</helmet>

<div style="background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden">
  
  <!-- ambient grid + glow -->
  <div style="position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,#000 30%,transparent 75%);pointer-events:none"></div>
  <div style="position:absolute;top:50%;left:50%;width:600px;height:600px;background:radial-gradient(circle,var(--glow-2),transparent 65%);filter:blur(30px);animation:auroraPulse 8s ease-in-out infinite;pointer-events:none;transform:translate(-50%,-50%)"></div>

  <!-- card -->
  <div style="position:relative;width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border-strong);border-radius:24px;padding:36px;box-shadow:var(--shadow);z-index:10">
    
    <!-- logo -->
    <div style="display:flex;justify-content:center;margin-bottom:24px">
      <a href="landing.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)">
        <div style="width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,var(--violet),var(--violet-2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--glow-2)">
          <div style="width:12px;height:12px;border-radius:50%;background:#fff"></div>
        </div>
        <span style="font-family:'Space Grotesk';font-weight:700;font-size:20px;letter-spacing:-.01em">AETHERMIND</span>
      </a>
    </div>

    <!-- title -->
    <h2 style="font-family:'Space Grotesk';font-size:22px;font-weight:700;text-align:center;margin-bottom:28px">Local-first AI suite</h2>

    <!-- error banner -->
    <sc-if value="{{ hasError }}" hint-placeholder-val="">
      <div style="background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);color:var(--danger);padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:20px;line-height:1.4">
        {{ errorMsg }}
      </div>
    </sc-if>

    <!-- tabs -->
    <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:24px">
      <button onClick="{{ setLoginTab }}" style="{{ loginTabStyle }}">Log In</button>
      <button onClick="{{ setSignupTab }}" style="{{ signupTabStyle }}">Sign Up</button>
    </div>

    <!-- Login Form -->
    <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
      <div>
        <input value="{{ loginEmail }}" onChange="{{ onLoginEmail }}" placeholder="Email address" style="{{ inputStyle }}">
        <input type="password" value="{{ loginPassword }}" onChange="{{ onLoginPassword }}" onKeyDown="{{ onLoginKey }}" placeholder="Password" style="{{ inputStyle }}">

        <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:24px">
          <label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--text-dim)">
            <input type="checkbox" checked="{{ rememberMe }}" onChange="{{ toggleRemember }}" style="accent-color:var(--violet)">
            Remember me
          </label>
          <a href="#" onClick="{{ forgotPassword }}" style="color:var(--violet-2);text-decoration:none;font-weight:600">Forgot password?</a>
        </div>

        <button onClick="{{ handleLogin }}" disabled="{{ submitting }}" style="{{ btnStyle }}">
          {{ loginBtnText }}
        </button>

        <div style="display:flex;align-items:center;margin:24px 0;color:var(--text-faint);font-size:12px;font-family:'JetBrains Mono'">
          <div style="flex:1;border-bottom:1px solid var(--border)"></div>
          <span style="padding:0 12px">OR</span>
          <div style="flex:1;border-bottom:1px solid var(--border)"></div>
        </div>

        <button onClick="{{ handleGoogle }}" style="{{ googleBtnStyle }}">
          <img src="https://www.google.com/favicon.ico" width="16" height="16" alt="G" style="flex:none">
          Continue with Google
        </button>
      </div>
    </sc-if>

    <!-- Sign Up Form -->
    <sc-if value="{{ isSignup }}" hint-placeholder-val="">
      <div>
        <input value="{{ signupName }}" onChange="{{ onSignupName }}" placeholder="Full Name" style="{{ inputStyle }}">
        <input value="{{ signupEmail }}" onChange="{{ onSignupEmail }}" placeholder="Email address" style="{{ inputStyle }}">
        <input type="password" value="{{ signupPassword }}" onChange="{{ onSignupPassword }}" placeholder="Create Password (min. 6 chars)" style="{{ inputStyle }}">
        <input type="password" value="{{ signupConfirm }}" onChange="{{ onSignupConfirm }}" onKeyDown="{{ onSignupKey }}" placeholder="Confirm Password" style="{{ inputStyle }}">

        <label style="display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-dim);cursor:pointer;margin-bottom:24px;line-height:1.4">
          <input type="checkbox" checked="{{ termsAgree }}" onChange="{{ toggleTerms }}" style="accent-color:var(--violet)">
          I agree to the <a href="#" style="color:var(--violet-2);text-decoration:none;font-weight:600;margin-left:4px">Terms of Service</a>
        </label>

        <button onClick="{{ handleSignUp }}" disabled="{{ submitting }}" style="{{ btnStyle }}">
          {{ signupBtnText }}
        </button>
      </div>
    </sc-if>

    <a href="landing.html" style="display:block;text-align:center;margin-top:24px;color:var(--text-faint);font-size:13px;text-decoration:none" style-hover="color:var(--text-dim)">← Back to landing page</a>

  </div>
</div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    activeTab: 'login',
    errorMsg: '',
    submitting: false,
    loginEmail: '',
    loginPassword: '',
    rememberMe: true,
    signupName: '',
    signupEmail: '',
    signupPassword: '',
    signupConfirm: '',
    termsAgree: false
  };

  setTab = (tab) => this.setState({ activeTab: tab, errorMsg: '' });
  setLoginTab = () => this.setTab('login');
  setSignupTab = () => this.setTab('signup');

  onLoginEmail = (e) => this.setState({ loginEmail: e.target.value });
  onLoginPassword = (e) => this.setState({ loginPassword: e.target.value });
  toggleRemember = (e) => this.setState({ rememberMe: e.target.checked });

  onSignupName = (e) => this.setState({ signupName: e.target.value });
  onSignupEmail = (e) => this.setState({ signupEmail: e.target.value });
  onSignupPassword = (e) => this.setState({ signupPassword: e.target.value });
  onSignupConfirm = (e) => this.setState({ signupConfirm: e.target.value });
  toggleTerms = (e) => this.setState({ termsAgree: e.target.checked });

  forgotPassword = (e) => {
    e.preventDefault();
    this.setState({ errorMsg: 'Password reset link would be sent to your email (demo only).' });
  };

  handleGoogle = () => {
    this.setState({ errorMsg: 'Google sign-in is not configured for this local instance.' });
  };

  onLoginKey = (e) => { if (e.key === 'Enter') this.handleLogin(); };
  onSignupKey = (e) => { if (e.key === 'Enter') this.handleSignUp(); };

  handleLogin = async () => {
    const { loginEmail, loginPassword, rememberMe } = this.state;
    if (!loginEmail.trim() || !loginPassword) {
      return this.setState({ errorMsg: 'Please enter both email and password.' });
    }
    this.setState({ submitting: true, errorMsg: '' });

    try {
      if (typeof window.login === 'function') {
        const res = await window.login(loginEmail.trim(), loginPassword, rememberMe);
        if (res && res.success) {
          window.location.href = 'index.html';
          return;
        }
      }
      window.location.href = 'index.html';
    } catch (err) {
      this.setState({ errorMsg: err.message || 'Login failed. Please check credentials.', submitting: false });
    }
  };

  handleSignUp = async () => {
    const { signupName, signupEmail, signupPassword, signupConfirm, termsAgree } = this.state;
    if (!signupName.trim() || !signupEmail.trim() || !signupPassword || !signupConfirm) {
      return this.setState({ errorMsg: 'All fields are required.' });
    }
    if (signupPassword !== signupConfirm) {
      return this.setState({ errorMsg: 'Passwords do not match.' });
    }
    if (signupPassword.length < 6) {
      return this.setState({ errorMsg: 'Password must be at least 6 characters.' });
    }
    if (!termsAgree) {
      return this.setState({ errorMsg: 'You must agree to the Terms of Service.' });
    }
    this.setState({ submitting: true, errorMsg: '' });

    try {
      if (typeof window.signUp === 'function') {
        const res = await window.signUp(signupEmail.trim(), signupPassword, signupName.trim());
        if (res && res.success) {
          if (typeof window.login === 'function') {
            await window.login(signupEmail.trim(), signupPassword, true);
          }
          window.location.href = 'index.html';
          return;
        }
      }
      window.location.href = 'index.html';
    } catch (err) {
      this.setState({ errorMsg: err.message || 'Sign up failed.', submitting: false });
    }
  };

  renderVals() {
    const st = this.state;
    const isLogin = st.activeTab === 'login';
    const isSignup = st.activeTab === 'signup';

    const tabBaseStyle = {
      flex: 1,
      textAlign: 'center',
      padding: '12px',
      fontSize: '14.5px',
      fontWeight: 600,
      cursor: 'pointer',
      background: 'transparent',
      border: 'none',
      borderBottom: '2px solid transparent',
      transition: 'all 0.2s ease',
      fontFamily: 'Hanken Grotesk'
    };

    return {
      hasError: st.errorMsg.length > 0,
      errorMsg: st.errorMsg,
      isLogin,
      isSignup,
      loginEmail: st.loginEmail,
      loginPassword: st.loginPassword,
      rememberMe: st.rememberMe,
      signupName: st.signupName,
      signupEmail: st.signupEmail,
      signupPassword: st.signupPassword,
      signupConfirm: st.signupConfirm,
      termsAgree: st.termsAgree,
      submitting: st.submitting,
      loginBtnText: st.submitting ? 'Signing in...' : 'Sign In',
      signupBtnText: st.submitting ? 'Creating account...' : 'Create Account',
      
      setLoginTab: this.setLoginTab,
      setSignupTab: this.setSignupTab,
      onLoginEmail: this.onLoginEmail,
      onLoginPassword: this.onLoginPassword,
      onLoginKey: this.onLoginKey,
      toggleRemember: this.toggleRemember,
      onSignupName: this.onSignupName,
      onSignupEmail: this.onSignupEmail,
      onSignupPassword: this.onSignupPassword,
      onSignupConfirm: this.onSignupConfirm,
      onSignupKey: this.onSignupKey,
      toggleTerms: this.toggleTerms,
      forgotPassword: this.forgotPassword,
      handleLogin: this.handleLogin,
      handleSignUp: this.handleSignUp,
      handleGoogle: this.handleGoogle,

      loginTabStyle: {
        ...tabBaseStyle,
        color: isLogin ? 'var(--violet-2)' : 'var(--text-faint)',
        borderBottomColor: isLogin ? 'var(--violet)' : 'transparent'
      },
      signupTabStyle: {
        ...tabBaseStyle,
        color: isSignup ? 'var(--violet-2)' : 'var(--text-faint)',
        borderBottomColor: isSignup ? 'var(--violet)' : 'transparent'
      },
      inputStyle: {
        width: '100%',
        padding: '12px 16px',
        marginBottom: '16px',
        border: '1px solid var(--border)',
        borderRadius: '12px',
        fontSize: '14.5px',
        background: 'var(--bg-2)',
        color: 'var(--text)',
        outline: 'none',
        transition: 'border-color 0.2s',
        fontFamily: 'Hanken Grotesk'
      },
      btnStyle: {
        width: '100%',
        padding: '14px',
        background: 'linear-gradient(140deg,var(--violet),var(--violet-2))',
        color: '#fff',
        border: 'none',
        borderRadius: '12px',
        fontWeight: 600,
        fontSize: '15px',
        cursor: st.submitting ? 'not-allowed' : 'pointer',
        opacity: st.submitting ? 0.7 : 1,
        fontFamily: 'Hanken Grotesk',
        boxShadow: st.submitting ? 'none' : '0 8px 24px -8px var(--glow-1)'
      },
      googleBtnStyle: {
        width: '100%',
        padding: '14px',
        background: 'var(--bg-2)',
        color: 'var(--text-dim)',
        border: '1px solid var(--border)',
        borderRadius: '12px',
        fontWeight: 600,
        fontSize: '15px',
        cursor: 'pointer',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        gap: '12px',
        fontFamily: 'Hanken Grotesk'
      }
    };
  }
}
</script>
</body>
</html>
